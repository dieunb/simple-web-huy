services:
  db:
    image: postgres:16-alpine
    container_name: simpleweb-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: simpleweb-app
    #command: bash -c "bundle exec rake db:migrate && bundle exec rackup -o 0.0.0.0 -p 9292"
    command: bash -c "bundle exec puma -C config/puma.rb"
    volumes:
      - .:/app
    ports:
      - "9292:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RACK_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}

  redis:
    image: redis:7-alpine
    container_name: simpleweb-redis

  grpc:
    build: .
    container_name: simpleweb-grpc
    command: bundle exec ruby grpc/user_server.rb
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      RACK_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      USER_GRPC_PORT: 50051

  worker:
    build: .
    container_name: simpleweb-worker
    command: bundle exec sidekiq -C config/sidekiq.yml -r ./config/sidekiq_loader.rb
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - grpc
    environment:
      RACK_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      USER_GRPC_HOST: grpc
      USER_GRPC_PORT: 50051
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}

volumes:
  postgres_data: