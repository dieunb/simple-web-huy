# Default RuboCop configuration
AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

# Exclude schema.rb from BlockLength checks
Metrics/BlockLength:
  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/*'

# Exclude generated protobuf files from line length checks
Layout/LineLength:
  Exclude:
    - 'grpc/*_pb.rb'

Naming/BlockForwarding:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

Style/HashConversion:
  Enabled: false